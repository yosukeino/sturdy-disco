<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Energy Flame / Lightning Gradient (Gold to Orange) -->
    <linearGradient id="goldFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22D3EE" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="16"/>
  
  <!-- Inner Comic Border -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="#000000" stroke-width="10" stroke-dasharray="16 8" opacity="0.4"/>

  <!-- Background Rays (Energy Burst) -->
  <g opacity="0.15" stroke="#FBBF24" stroke-width="4">
    <line x1="256" y1="256" x2="50" y2="70"/>
    <line x1="256" y1="256" x2="120" y2="40"/>
    <line x1="256" y1="256" x2="392" y2="40"/>
    <line x1="256" y1="256" x2="462" y2="70"/>
    <line x1="256" y1="256" x2="480" y2="200"/>
    <line x1="256" y1="256" x2="480" y2="312"/>
    <line x1="256" y1="256" x2="462" y2="442"/>
    <line x1="256" y1="256" x2="50" y2="442"/>
    <line x1="256" y1="256" x2="32" y2="312"/>
    <line x1="256" y1="256" x2="32" y2="200"/>
  </g>

  <!-- Baseball Home Plate & Seams Silhouette in center background -->
  <path d="M256 120 L380 210 L330 350 L182 350 L132 210 Z" fill="#1E293B" stroke="#334155" stroke-width="8" opacity="0.6"/>

  <!-- Giant Electric Energy Bat / Lightning Bolt (ドカベン × ドーパミン) -->
  <g filter="url(#neonGlow)">
    <!-- Huge Dynamic Lightning Bolt Slicing through -->
    <path d="M290 60 L140 260 L240 260 L190 450 L380 220 L270 220 Z" fill="url(#goldFlame)" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Cyan Spark Accent on Top-Right -->
  <g filter="url(#cyanGlow)">
    <polygon points="410,90 422,125 457,137 422,149 410,184 398,149 363,137 398,125" fill="url(#cyanElectric)"/>
  </g>

  <!-- Katakana 'ド' Mark Accent at bottom-center badge -->
  <rect x="156" y="382" width="200" height="64" rx="16" fill="#000000" stroke="#F59E0B" stroke-width="6"/>
  <text x="256" y="428" font-family="Impact, Arial Black, sans-serif" font-size="40" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ドパベン</text>
</svg>