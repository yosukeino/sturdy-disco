<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base App Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Worksheet Sheet -->
  <rect x="98" y="86" width="316" height="344" rx="36" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Header line (Blue) -->
  <rect x="144" y="146" width="136" height="22" rx="11" fill="#60A5FA"/>

  <!-- Question sentence lines (Slate) -->
  <rect x="144" y="200" width="224" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="144" y="254" width="176" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="144" y="308" width="208" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="144" y="362" width="140" height="20" rx="10" fill="#E2E8F0"/>

  <!-- Big Vibrant Checkmark (Pass / 100 points) -->
  <path d="M168 280 L236 348 L356 186" fill="none" stroke="url(#checkGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden Star in Top-Right Corner -->
  <g filter="url(#starShadow)">
    <polygon points="396,56 414,94 456,100 426,130 433,172 396,152 359,172 366,130 336,100 378,94" fill="url(#starGrad)"/>
  </g>
</svg>
